<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <!-- Original illustration of a Beagle — side profile, tricolor coat, floppy ears -->

  <!-- Ground shadow -->
  <ellipse cx="200" cy="288" rx="115" ry="9" fill="#cbb89e" opacity="0.35"/>

  <!-- Back legs (darker tan) -->
  <rect x="232" y="200" width="22" height="80" rx="11" fill="#a9743c"/>
  <rect x="263" y="200" width="22" height="80" rx="11" fill="#8c5e2e"/>

  <!-- Front legs (white) -->
  <rect x="125" y="200" width="22" height="80" rx="11" fill="#f5ead6"/>
  <rect x="158" y="200" width="22" height="80" rx="11" fill="#f5ead6"/>

  <!-- Tail — white-tipped, curving up -->
  <path d="M278 168 Q308 148 304 126 Q298 142 286 158" fill="#f5ead6" stroke="#a9743c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Body -->
  <ellipse cx="200" cy="168" rx="98" ry="52" fill="#a9743c"/>

  <!-- Black saddle patch across the back -->
  <path d="M135 142 Q200 116 262 142 Q256 168 200 162 Q148 162 135 142 Z" fill="#3d2b1f"/>

  <!-- White belly and chest -->
  <ellipse cx="190" cy="196" rx="68" ry="26" fill="#f5ead6"/>
  <path d="M120 158 Q112 175 128 196 Q140 185 148 168 Z" fill="#f5ead6"/>

  <!-- Neck -->
  <path d="M118 152 Q102 138 108 112 L142 128 L138 172 Z" fill="#a9743c"/>

  <!-- Head -->
  <ellipse cx="92" cy="112" rx="36" ry="31" fill="#a9743c"/>

  <!-- Snout (white) -->
  <ellipse cx="68" cy="124" rx="26" ry="19" fill="#f5ead6"/>

  <!-- Nose -->
  <ellipse cx="54" cy="119" rx="9" ry="6.5" fill="#241710"/>

  <!-- Mouth -->
  <path d="M54 128 Q62 136 70 132" fill="none" stroke="#7a5227" stroke-width="2" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="94" cy="104" r="5.5" fill="#241710"/>
  <circle cx="92" cy="102" r="1.8" fill="#fff"/>

  <!-- Long floppy ear -->
  <path d="M108 92 Q90 98 82 114 Q74 148 96 170 Q114 162 122 148 Q114 118 114 96 Z" fill="#7a4f24"/>

  <!-- White blaze on forehead -->
  <path d="M99 92 Q94 105 97 120" fill="none" stroke="#f5ead6" stroke-width="5" stroke-linecap="round"/>

  <!-- Red collar with gold tag -->
  <rect x="98" y="132" width="38" height="9" rx="4" fill="#c63d2f"/>
  <circle cx="117" cy="141" r="4.5" fill="#f0c020"/>
</svg>
