<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <!-- Original illustration of a Poodle — fluffy curly coat, topknot, pompom clip on legs -->

  <!-- Ground shadow -->
  <ellipse cx="200" cy="288" rx="110" ry="9" fill="#cbb89e" opacity="0.35"/>

  <!-- Legs (slim) -->
  <rect x="145" y="210" width="14" height="45" fill="#e8dcc4"/>
  <rect x="175" y="210" width="14" height="45" fill="#e8dcc4"/>
  <rect x="218" y="210" width="14" height="45" fill="#d8cab0"/>
  <rect x="248" y="210" width="14" height="45" fill="#d8cab0"/>

  <!-- Pompoms on ankles -->
  <circle cx="152" cy="252" r="16" fill="#e8dcc4"/>
  <circle cx="182" cy="252" r="16" fill="#e8dcc4"/>
  <circle cx="225" cy="252" r="16" fill="#d8cab0"/>
  <circle cx="255" cy="252" r="16" fill="#d8cab0"/>

  <!-- Curly body — large fluffy oval with curl circles -->
  <ellipse cx="200" cy="170" rx="72" ry="56" fill="#f0e6d0"/>

  <!-- Curl texture circles on body -->
  <circle cx="155" cy="155" r="8" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="175" cy="145" r="9" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="200" cy="140" r="10" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="225" cy="145" r="9" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="248" cy="155" r="8" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="160" cy="185" r="9" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="190" cy="190" r="10" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="220" cy="190" r="10" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="245" cy="185" r="9" fill="none" stroke="#d8cab0" stroke-width="2"/>

  <!-- Tail pompom -->
  <circle cx="280" cy="165" r="16" fill="#f0e6d0"/>
  <circle cx="280" cy="165" r="7" fill="none" stroke="#d8cab0" stroke-width="2"/>

  <!-- Neck -->
  <path d="M160 130 Q150 110 158 88 L185 100 L180 140 Z" fill="#e8dcc4"/>

  <!-- Head — rounded -->
  <ellipse cx="145" cy="85" rx="30" ry="28" fill="#f0e6d0"/>
  <circle cx="130" cy="75" r="10" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="150" cy="70" r="11" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="155" cy="92" r="9" fill="none" stroke="#d8cab0" stroke-width="2"/>

  <!-- Topknot pompom on head -->
  <circle cx="138" cy="58" r="20" fill="#f0e6d0"/>
  <circle cx="132" cy="55" r="8" fill="none" stroke="#d8cab0" stroke-width="2"/>
  <circle cx="145" cy="52" r="9" fill="none" stroke="#d8cab0" stroke-width="2"/>

  <!-- Long snout -->
  <ellipse cx="112" cy="95" rx="22" ry="12" fill="#e8dcc4"/>

  <!-- Nose -->
  <ellipse cx="96" cy="92" rx="8" ry="6" fill="#241710"/>

  <!-- Mouth -->
  <path d="M96 99 Q104 106 112 103" fill="none" stroke="#b09870" stroke-width="2" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="142" cy="82" r="5" fill="#241710"/>
  <circle cx="140" cy="80" r="1.8" fill="#fff"/>

  <!-- Floppy long ears -->
  <path d="M160 70 Q172 72 176 92 Q178 130 162 148 Q152 142 150 128 Q158 100 155 72 Z" fill="#d8cab0"/>

  <!-- Pink collar with tag -->
  <rect x="150" y="108" width="34" height="8" rx="4" fill="#d4546a"/>
  <circle cx="167" cy="116" r="4" fill="#f0c020"/>
</svg>
